<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueceu a Senha - Projeto Green Flames</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/imagem/green flames.png">
    <link rel="shortcut icon" type="image/png" href="assets/imagem/green flames.png">
    <link rel="apple-touch-icon" href="assets/imagem/green flames.png">
    
    <link rel="stylesheet" href="css/geral.css">
  </head>
<body>

  <div class="page">
    <form method="POST" class="formLogin">
      <div class="login-header">
        <img src="assets/imagem/green flames login.png" alt="Logo Projeto Green Flames" class="logo">
        <h1>Recuperar Senha</h1>
      </div>

      <p>Digite seu e-mail para receber as instruções de recuperação de senha.</p>
      
      <label for="email">E-mail</label>
      <input id="email" type="email" name="email" placeholder="Digite seu e-mail cadastrado" required autofocus>

      <div id="recoveryFields" style="display:none">
        <label for="newPassword">Nova senha</label>
        <input id="newPassword" type="password" minlength="6" autocomplete="new-password" placeholder="Digite sua nova senha">
        <label for="confirmPassword">Confirme a nova senha</label>
        <input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" placeholder="Repita a nova senha">
      </div>
      <input id="recoverySubmit" type="submit" value="Enviar Instruções" class="btn">
      
      <div class="form-links">
        <a href="entrar.html" class="back-link">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12 19-7-7 7-7"/>
            <path d="M19 12H5"/>
          </svg>
          Voltar ao Login
        </a>
      </div>
    </form>
  </div>

  <script type="module">
    import { supabase } from "./js/supabase-client.js";
    const form = document.querySelector(".formLogin");
    const emailInput = document.getElementById("email");
    const recoveryFields = document.getElementById("recoveryFields");
    const newPassword = document.getElementById("newPassword");
    const confirmPassword = document.getElementById("confirmPassword");
    const submitButton = document.getElementById("recoverySubmit");
    let recoveryMode = new URLSearchParams(window.location.hash.replace(/^#/, "")).get("type") === "recovery";

    function enablePasswordUpdate() {
      recoveryMode = true;
      emailInput.closest("label")?.setAttribute("hidden", "");
      emailInput.setAttribute("hidden", "");
      recoveryFields.style.display = "block";
      document.querySelector(".login-header h1").textContent = "Definir nova senha";
      form.querySelector("p").textContent = "Digite e confirme sua nova senha.";
      submitButton.value = "Salvar nova senha";
    }

    supabase.auth.onAuthStateChange(event => {
      if (event === "PASSWORD_RECOVERY") enablePasswordUpdate();
    });
    const { data: sessionData } = await supabase.auth.getSession();
    if (recoveryMode && sessionData.session) enablePasswordUpdate();

    form.addEventListener("submit", async event => {
      event.preventDefault();
      const original = submitButton.value;
      submitButton.disabled = true;
      submitButton.value = recoveryMode ? "Salvando..." : "Enviando...";
      if (recoveryMode) {
        if (newPassword.value.length < 6 || newPassword.value !== confirmPassword.value) {
          alert("As senhas devem ser iguais e ter pelo menos 6 caracteres.");
          submitButton.disabled = false;
          submitButton.value = original;
          return;
        }
        const { error } = await supabase.auth.updateUser({ password: newPassword.value });
        if (error) {
          alert("Não foi possível atualizar a senha: " + error.message);
          submitButton.disabled = false;
          submitButton.value = original;
          return;
        }
        await supabase.auth.signOut();
        alert("Senha atualizada. Entre novamente com a nova senha.");
        window.location.href = "entrar.html";
        return;
      }

      const email = emailInput.value.trim();
      const redirectTo = new URL("esqueceu-senha.html", window.location.href).href;
      const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo });
      if (error) {
        alert("Não foi possível enviar o link: " + error.message);
        submitButton.disabled = false;
        submitButton.value = original;
        return;
      }
      alert("Se o e-mail estiver cadastrado, você receberá um link para redefinir sua senha.");
      submitButton.disabled = false;
      submitButton.value = original;
    });
  </script>

</body>
</html>
